ole="img" aria-label="Modelo 3D do escritório, com quatro lugares à esquerda e MAGNUS à direita entre as duas portas"></main><div class="bottom"><label>Ambiente <select id="style"><option value="1">1 · Galeria iluminada</option><option value="2">2 · Móvel de arrumação</option><option value="3">3 · Quadro branco</option><option value="4">4 · Mural e cortiça</option><option value="5">5 · Banco com arrumação</option></select></label><label><input id="dimensions" type="checkbox">Mostrar medidas</label><label><input id="uppers" type="checkbox" checked>Arrumação suspensa</label><a href="planta-cotada.svg" target="_blank">Planta cotada ↗</a><a href="index.html">Voltar à galeria</a><span>Vãos por leitura gráfica. Altura do teto e peitoril assumidos. Portas fechadas nas vistas interiores.</span></div><script src="modelo-3d.js"></script></body></html>
